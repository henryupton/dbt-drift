name: 'dbt_drift'
version: '1.0.0'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: 'dbt_drift'

# These configurations specify where dbt should look for different types of files.
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

# Configure vars for resource management
vars:
  dbt_drift:
    # Report drift between config and the warehouse (logs planned actions)
    show_drift: true
    # Apply changes to make the warehouse match config (create/update/delete).
    # Left false by default so `run` is read-only until you opt in.
    reconcile_drift: false

    # Resource configurations
    resources:
      udf:
        calculate_discount:
          arguments: "price number, discount_pct number"
          returns: "number"
          language: "sql"
          definition: "price * (1 - discount_pct / 100)"
          comment: "Calculates discounted price"

      row_access_policy:
        restrict_by_region:
          signature: "region string"
          body: |
            case
              when current_role() = 'ADMIN' then true
              when region = current_role() then true
              else false
            end
          comment: "Row-level security by region / role"

      file_format:
        standard_csv:
          type: csv
          field_delimiter: "|"
          skip_header: 1
          compression: gzip
          comment: "Pipe-delimited CSV"

      masking_policy:
        mask_email:
          signature: "val string"
          returns: "string"
          body: |
            case
              when current_role() = 'ADMIN' then val
              else '***masked***'
            end
          comment: "Mask email unless ADMIN"

      stored_procedure:
        log_run:
          arguments: "run_label string"
          returns: "string"
          language: "sql"
          definition: |
            begin
              return 'logged: ' || run_label;
            end;
          comment: "Example logging procedure"
