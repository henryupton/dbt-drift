name: 'dbt_drift_integration_tests'
version: '1.0.0'
config-version: 2

profile: 'integration_tests'

macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

on-run-start:
  - "{{ dbt_drift.run() }}"

vars:
  dbt_drift:
    show_drift: true
    # Integration tests apply changes so resources actually get created
    reconcile_drift: true

    resources:
      udf:
        to_aet:
          arguments: "ts timestamp_tz"
          returns: "timestamp_tz(9)"
          language: "sql"
          definition: "convert_timezone('Australia/Melbourne', ts)"
          comment: "Function which converts UTC timestamp to Australia/Melbourne timezone"

        to_aet_date:
          arguments: "dt date"
          returns: "date"
          language: "sql"
          definition: "convert_timezone('Australia/Melbourne', dt::timestamp_tz)::date"
          comment: "Converts UTC date to Australia/Melbourne date"

        smoke_py_stem:
          arguments: "text varchar"
          returns: "varchar"
          language: "python"
          runtime_version: "3.11"
          handler: "stem"
          packages: ["snowballstemmer"]
          definition: |
            import snowballstemmer
            _stemmer = snowballstemmer.stemmer('english')
            def stem(text):
                if text is None:
                    return None
                return ' '.join(_stemmer.stemWords(text.split()))
          comment: "Smoke test Python UDF with a package"

      row_access_policy:
        smoke_rap:
          signature: "region string"
          body: |
            case
              when current_role() = 'ACCOUNTADMIN' then true
              else false
            end
          comment: "Smoke test row access policy"

      masking_policy:
        smoke_mask:
          signature: "val string"
          returns: "string"
          body: |
            case
              when current_role() = 'ACCOUNTADMIN' then val
              else '***masked***'
            end
          comment: "Smoke test masking policy"

      file_format:
        smoke_csv:
          type: csv
          field_delimiter: "|"
          skip_header: 1
          compression: gzip
          comment: "Smoke test CSV file format"

      stored_procedure:
        smoke_proc:
          arguments: "x number"
          returns: "number"
          language: "sql"
          definition: |
            begin
              return x + 1;
            end;
          comment: "Smoke test stored procedure"
